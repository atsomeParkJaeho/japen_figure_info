services:
  db:
    image: postgres:16-alpine
    container_name: japen_figure_info_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: japen_figure_info
      POSTGRES_USER: jaeho
      POSTGRES_PASSWORD: dnfldkQk2@
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jaeho -d japen_figure_info']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: japen_figure_info_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: japen_figure_info_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.dev
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
